<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Responsive-Image-Filter-Gallery.css">
</head>
<body>
    <header class="gallery-header">
        <h1>Responsive CSS Filter Gallery</h1>
        <p>Demonstrating Grid repeat(auto-fit, minmax(200px, 1fr)) and 6 interactive CSS filters with smooth hover transitions</p>
    </header>

    <main class="filter-grid">
        <!-- Image 1: Blur Filter -->
        <figure class="filter-item">
            <div class="img-frame">
                <svg class="demo-img filter-blur" viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="gBlur" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient></defs>
                    <rect width="300" height="220" fill="url(#gBlur)"/>
                    <circle cx="150" cy="90" r="45" fill="#facc15"/>
                    <polygon points="30,220 150,120 270,220" fill="#0f172a"/>
                    <text x="150" y="195" font-family="sans-serif" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">BLUR</text>
                </svg>
            </div>
            <figcaption>1. Filter: blur(4px)</figcaption>
        </figure>

        <!-- Image 2: Grayscale Filter -->
        <figure class="filter-item">
            <div class="img-frame">
                <svg class="demo-img filter-grayscale" viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="gGray" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient></defs>
                    <rect width="300" height="220" fill="url(#gGray)"/>
                    <circle cx="150" cy="90" r="45" fill="#facc15"/>
                    <polygon points="30,220 150,120 270,220" fill="#0f172a"/>
                    <text x="150" y="195" font-family="sans-serif" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">GRAYSCALE</text>
                </svg>
            </div>
            <figcaption>2. Filter: grayscale(100%)</figcaption>
        </figure>

        <!-- Image 3: Sepia Filter -->
        <figure class="filter-item">
            <div class="img-frame">
                <svg class="demo-img filter-sepia" viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="gSepia" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#047857"/></linearGradient></defs>
                    <rect width="300" height="220" fill="url(#gSepia)"/>
                    <circle cx="150" cy="90" r="45" fill="#facc15"/>
                    <polygon points="30,220 150,120 270,220" fill="#0f172a"/>
                    <text x="150" y="195" font-family="sans-serif" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">SEPIA</text>
                </svg>
            </div>
            <figcaption>3. Filter: sepia(90%)</figcaption>
        </figure>

        <!-- Image 4: Brightness Filter -->
        <figure class="filter-item">
            <div class="img-frame">
                <svg class="demo-img filter-brightness" viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="gBright" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/></linearGradient></defs>
                    <rect width="300" height="220" fill="url(#gBright)"/>
                    <circle cx="150" cy="90" r="45" fill="#ffffff"/>
                    <polygon points="30,220 150,120 270,220" fill="#0f172a"/>
                    <text x="150" y="195" font-family="sans-serif" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">BRIGHTNESS</text>
                </svg>
            </div>
            <figcaption>4. Filter: brightness(160%)</figcaption>
        </figure>

        <!-- Image 5: Contrast Filter -->
        <figure class="filter-item">
            <div class="img-frame">
                <svg class="demo-img filter-contrast" viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="gContrast" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#5b21b6"/></linearGradient></defs>
                    <rect width="300" height="220" fill="url(#gContrast)"/>
                    <circle cx="150" cy="90" r="45" fill="#38bdf8"/>
                    <polygon points="30,220 150,120 270,220" fill="#0f172a"/>
                    <text x="150" y="195" font-family="sans-serif" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">CONTRAST</text>
                </svg>
            </div>
            <figcaption>5. Filter: contrast(200%)</figcaption>
        </figure>

        <!-- Image 6: Hue-Rotate Filter -->
        <figure class="filter-item">
            <div class="img-frame">
                <svg class="demo-img filter-hue" viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="gHue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0e7490"/></linearGradient></defs>
                    <rect width="300" height="220" fill="url(#gHue)"/>
                    <circle cx="150" cy="90" r="45" fill="#f43f5e"/>
                    <polygon points="30,220 150,120 270,220" fill="#0f172a"/>
                    <text x="150" y="195" font-family="sans-serif" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">HUE-ROTATE</text>
                </svg>
            </div>
            <figcaption>6. Filter: hue-rotate(180deg)</figcaption>
        </figure>
    </main>

    <footer class="gallery-footer">
        <p>&copy; 2026 CSS Filter Matrix • Hover over images to remove filter effect</p>
    </footer>
</body>
</html>
