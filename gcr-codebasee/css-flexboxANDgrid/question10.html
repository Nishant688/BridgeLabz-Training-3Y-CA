<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <link rel="stylesheet" href="question10.css">
</head>
<body>

    <header>
        <h1>MySite</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Articles</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <article>
            <h2>Welcome to My Website</h2>

            <p>
                This webpage uses both Flexbox and CSS Grid
                to create a responsive layout.
            </p>

            <div class="boxes">
                <div class="box">HTML</div>
                <div class="box">CSS</div>
                <div class="box">Web Design</div>
            </div>
        </article>

        <aside>
            <h2>Sidebar</h2>

            <ul>
                <li>Latest Posts</li>
                <li>Categories</li>
                <li>Popular Articles</li>
            </ul>
        </aside>

    </main>

    <footer>
        <p>&copy; 2026 MySite</p>
    </footer>

</body>
</html>
