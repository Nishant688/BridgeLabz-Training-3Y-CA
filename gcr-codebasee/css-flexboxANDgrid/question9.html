<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card</title>
    <link rel="stylesheet" href="question9.css">
</head>
<body>

    <div class="card">
        <div class="card-inner">

            <div class="card-front">
                <h2>Travel</h2>
                <img src="https://picsum.photos/250/200" alt="Travel">
            </div>

            <div class="card-back">
                <h2>About Travel</h2>
                <p>
                    Travelling helps us explore new places,
                    cultures and experiences.
                </p>
            </div>

        </div>
    </div>

</body>
</html>
