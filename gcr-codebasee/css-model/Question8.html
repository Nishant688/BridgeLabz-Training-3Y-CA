<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="Question8.css">
</head>
<body>

    <header>
        <h1>CSS Box Model</h1>
    </header>

    <main>

        <section class="model">
            <div class="margin-layer">
                <p>Margin</p>

                <div class="border-layer">
                    <p>Border</p>

                    <div class="padding-layer">
                        <p>Padding</p>

                        <div class="content-layer">
                            <p>Content</p>
                        </div>

                    </div>
                </div>
            </div>
        </section>

        <section class="description">
            <p><strong>Content:</strong> The actual text or element content.</p>
            <p><strong>Padding:</strong> Space between content and border.</p>
            <p><strong>Border:</strong> Line surrounding the padding and content.</p>
            <p><strong>Margin:</strong> Space outside the border.</p>
        </section>

        <section class="size-boxes">
            <div class="default-box">
                Default Box
            </div>

            <div class="border-box">
                Border-box
            </div>
        </section>

    </main>

    <footer>
        <p>Box Model Practice</p>
    </footer>

</body>
</html>
