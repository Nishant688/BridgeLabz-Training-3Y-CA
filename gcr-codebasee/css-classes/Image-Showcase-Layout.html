<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="Image-Showcase-Layout.css">
</head>
<body>
    <header class="showcase-header">
        <h1>Atmospheric Landscapes Showcase</h1>
        <p>Displaying 6 visual cards with hover scaling, darkening overlay, and semantic captions</p>
    </header>

    <main class="grid-showcase">
        <!-- Card 1 -->
        <figure class="showcase-card">
            <div class="image-wrapper">
                <svg class="showcase-img" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="s1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0f172a"/></linearGradient></defs>
                    <rect width="400" height="300" fill="url(#s1)"/>
                    <circle cx="200" cy="110" r="50" fill="#38bdf8" opacity="0.6"/>
                    <polygon points="40,300 200,150 360,300" fill="#0f172a"/>
                    <text x="200" y="270" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">Mountain Mist</text>
                </svg>
                <div class="dark-overlay"></div>
            </div>
            <figcaption>Glacial ranges under dawn clouds</figcaption>
        </figure>

        <!-- Card 2 -->
        <figure class="showcase-card">
            <div class="image-wrapper">
                <svg class="showcase-img" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="s2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#7c2d12"/></linearGradient></defs>
                    <rect width="400" height="300" fill="url(#s2)"/>
                    <circle cx="280" cy="90" r="45" fill="#fde047" opacity="0.8"/>
                    <path d="M0,230 Q100,180 200,240 T400,220 L400,300 L0,300 Z" fill="#451a03"/>
                    <text x="200" y="270" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">Sahara Sunset</text>
                </svg>
                <div class="dark-overlay"></div>
            </div>
            <figcaption>Dunes rolling in golden evening warmth</figcaption>
        </figure>

        <!-- Card 3 -->
        <figure class="showcase-card">
            <div class="image-wrapper">
                <svg class="showcase-img" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="s3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#064e3b"/></linearGradient></defs>
                    <rect width="400" height="300" fill="url(#s3)"/>
                    <circle cx="200" cy="140" r="60" fill="#34d399" opacity="0.4"/>
                    <text x="200" y="270" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">Rainforest Canopy</text>
                </svg>
                <div class="dark-overlay"></div>
            </div>
            <figcaption>Dense virgin forestry in equatorial reserves</figcaption>
        </figure>

        <!-- Card 4 -->
        <figure class="showcase-card">
            <div class="image-wrapper">
                <svg class="showcase-img" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="s4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#312e81"/></linearGradient></defs>
                    <rect width="400" height="300" fill="url(#s4)"/>
                    <polygon points="100,70 300,70 340,240 60,240" fill="#1e1b4b" opacity="0.6"/>
                    <text x="200" y="270" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">Cybernetic City</text>
                </svg>
                <div class="dark-overlay"></div>
            </div>
            <figcaption>Metropolitan skyline illuminated at midnight</figcaption>
        </figure>

        <!-- Card 5 -->
        <figure class="showcase-card">
            <div class="image-wrapper">
                <svg class="showcase-img" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="s5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient></defs>
                    <rect width="400" height="300" fill="url(#s5)"/>
                    <circle cx="200" cy="190" r="70" fill="#93c5fd" opacity="0.3"/>
                    <text x="200" y="270" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">Abyssal Trench</text>
                </svg>
                <div class="dark-overlay"></div>
            </div>
            <figcaption>Deep marine currents and coral ecosystems</figcaption>
        </figure>

        <!-- Card 6 -->
        <figure class="showcase-card">
            <div class="image-wrapper">
                <svg class="showcase-img" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="s6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#0f172a"/></linearGradient></defs>
                    <rect width="400" height="300" fill="url(#s6)"/>
                    <circle cx="120" cy="70" r="3" fill="#fff"/><circle cx="280" cy="80" r="3" fill="#fff"/>
                    <text x="200" y="270" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">Starlit Cosmos</text>
                </svg>
                <div class="dark-overlay"></div>
            </div>
            <figcaption>Dark skies remote observatories expedition</figcaption>
        </figure>
    </main>

    <footer class="showcase-footer">
        <p>&copy; 2026 Image Showcase Practice</p>
    </footer>
</body>
</html>
