<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface Layout</title>
    <link rel="stylesheet" href="Mini-User-Interface-Layout.css">
</head>
<body>
    <header class="mini-header">
        <div class="logo">MiniApp UI</div>
        <nav class="mini-nav">
            <a href="#feed">Feed</a>
            <a href="#messages">Messages</a>
            <a href="#account" class="active">Profile</a>
        </nav>
    </header>

    <main class="mini-stage">
        <!-- Main Content Card containing Form, Buttons, and Small Image -->
        <article class="profile-card">
            <header class="card-head">
                <div class="avatar-frame">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="avatar-svg">
                        <circle cx="50" cy="50" r="50" fill="#0284c7"/>
                        <circle cx="50" cy="38" r="18" fill="#e2e8f0"/>
                        <path d="M20 85 C20 62, 35 60, 50 60 C65 60, 80 62, 80 85 Z" fill="#e2e8f0"/>
                    </svg>
                </div>
                <div class="user-details">
                    <h2>Nishant Prajapati</h2>
                    <span class="user-role">Full Stack Engineer</span>
                </div>
            </header>

            <form class="profile-form" action="#" method="POST">
                <div class="input-field">
                    <label for="display-name">Display Name</label>
                    <input type="text" id="display-name" value="Nishant Prajapati" required>
                </div>

                <div class="input-field">
                    <label for="bio-text">Professional Headline</label>
                    <input type="text" id="bio-text" value="Developing reliable web platforms" required>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-save">Update Profile</button>
                    <button type="reset" class="btn btn-reset">Reset</button>
                </div>
            </form>
        </article>
    </main>

    <footer class="mini-footer">
        <p>&copy; 2026 Mini User Interface • Clean Semantic Responsive Design</p>
    </footer>
</body>
</html>
