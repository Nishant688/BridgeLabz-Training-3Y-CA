<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Page Greeting - jQuery</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 40px; text-align: center; }
        .card { max-width: 550px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .greeting-box { background: #e0f2fe; color: #0369a1; padding: 20px; border-radius: 8px; margin-bottom: 20px; cursor: pointer; font-weight: bold; font-size: 1.2rem; }
        button { padding: 10px 18px; margin: 5px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Interactive Welcome Portal</h2>
        <div id="greetingBanner">
            <div id="greetingMessage" class="greeting-box">Loading greeting...</div>
        </div>
        <div>
            <button id="changeGreetingBtn">Change Greeting</button>
            <button id="toggleGreetingBtn">Toggle Visibility</button>
        </div>
    </div>
    <script src="Welcome-Page-Greeting.js"></script>
</body>
</html>
