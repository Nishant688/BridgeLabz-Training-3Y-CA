<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Character Counter with Warning</title>
    <link rel="stylesheet" href="Live-Character-Counter.css">
</head>
<body>
    <div class="counter-card">
        <h2>Live Character Counter</h2>
        <textarea id="messageInput" rows="5" placeholder="Type your text here (Max 100 characters)..."></textarea>
        <div class="counter-footer">
            <span id="charCounter" class="counter-text">100 characters remaining</span>
            <button id="resetBtn">Reset</button>
        </div>
    </div>
    <script src="Live-Character-Counter.js"></script>
</body>
</html>
