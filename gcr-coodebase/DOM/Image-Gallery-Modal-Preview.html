<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery with Modal Preview</title>
    <link rel="stylesheet" href="Image-Gallery-Modal-Preview.css">
</head>
<body>
    <div class="gallery-wrapper">
        <h2>Photo Gallery (Click to Inspect)</h2>
        <div id="galleryGrid" class="gallery-grid">
            <div class="gallery-item"><img src="https://picsum.photos/id/1015/300/200" alt="River Valley"></div>
            <div class="gallery-item"><img src="https://picsum.photos/id/1018/300/200" alt="Mountain Pass"></div>
            <div class="gallery-item"><img src="https://picsum.photos/id/1025/300/200" alt="Pug in Blanket"></div>
            <div class="gallery-item"><img src="https://picsum.photos/id/1036/300/200" alt="Winter Snow Peak"></div>
            <div class="gallery-item"><img src="https://picsum.photos/id/1043/300/200" alt="Autumn Forest"></div>
            <div class="gallery-item"><img src="https://picsum.photos/id/1050/300/200" alt="Coastal Waves"></div>
        </div>
    </div>

    <!-- Modal Popup -->
    <div id="imageModal" class="modal-overlay">
        <div id="modalContent" class="modal-box">
            <img id="modalImage" src="" alt="Enlarged Preview">
            <p id="modalCaption"></p>
        </div>
    </div>
    <script src="Image-Gallery-Modal-Preview.js"></script>
</body>
</html>
