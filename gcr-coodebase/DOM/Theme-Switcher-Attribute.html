<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Theme Switcher via Attribute</title>
    <link rel="stylesheet" href="Theme-Switcher-Attribute.css">
</head>
<body>
    <div class="theme-card">
        <h2>Theme Switcher</h2>
        <p>Current Active Theme: <strong id="currentTheme">LIGHT</strong></p>
        <div class="theme-buttons">
            <button id="lightBtn">Light Mode</button>
            <button id="darkBtn">Dark Mode</button>
            <button id="blueBtn">Ocean Blue</button>
        </div>
    </div>
    <script src="Theme-Switcher-Attribute.js"></script>
</body>
</html>
