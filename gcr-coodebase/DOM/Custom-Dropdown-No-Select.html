<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Dropdown (No Select Tag)</title>
    <link rel="stylesheet" href="Custom-Dropdown-No-Select.css">
</head>
<body>
    <div class="card">
        <h2>Custom Dropdown Component</h2>
        <div id="customDropdown" class="dropdown-wrapper">
            <button id="dropdownBtn" class="dropdown-btn">Select Framework</button>
            <div id="optionsList" class="options-container">
                <div class="dropdown-item">Vanilla JavaScript</div>
                <div class="dropdown-item">React.js</div>
                <div class="dropdown-item">Vue.js</div>
                <div class="dropdown-item">Angular</div>
                <div class="dropdown-item">Svelte</div>
            </div>
        </div>
    </div>
    <script src="Custom-Dropdown-No-Select.js"></script>
</body>
</html>
