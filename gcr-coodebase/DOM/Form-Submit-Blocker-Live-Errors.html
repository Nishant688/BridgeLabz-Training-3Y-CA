<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submit Blocker with Live Errors</title>
    <link rel="stylesheet" href="Form-Submit-Blocker-Live-Errors.css">
</head>
<body>
    <div class="card">
        <h2>Account Validation Form</h2>
        <form id="validationForm">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="valName">
                <div id="valNameErr" class="error"></div>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="text" id="valEmail">
                <div id="valEmailErr" class="error"></div>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="valPass">
                <div id="valPassErr" class="error"></div>
            </div>
            <button type="submit" id="submitBtn">Submit Form</button>
            <div id="successMessage" class="success-box" style="display: none;"></div>
        </form>
    </div>
    <script src="Form-Submit-Blocker-Live-Errors.js"></script>
</body>
</html>
