<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Timetable Viewer - Fetch API</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 40px; }
        .card { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .day-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        select { padding: 9px 14px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; }
        .schedule-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-bottom: 1px solid #e2e8f0; }
        .time-pill { background: #e0f2fe; color: #0369a1; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .no-class-msg { padding: 25px; text-align: center; color: #64748b; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Departmental Timetable Viewer</h2>
        <div class="day-bar">
            <label for="daySelector"><strong>Select Weekday:</strong></label>
            <select id="daySelector">
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
            </select>
        </div>
        <div id="scheduleList"></div>
    </div>
    <script src="College-Timetable-Viewer.js"></script>
</body>
</html>
