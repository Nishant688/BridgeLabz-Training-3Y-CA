<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Status Dashboard - XMLHttpRequest & PATCH</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 40px; }
        .card { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .badge-active { background: #dcfce7; color: #15803d; }
        .badge-inactive { background: #fee2e2; color: #b91c1c; }
        .toggle-btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-activate { background: #16a34a; color: white; }
        .btn-deactivate { background: #dc2626; color: white; }
        .msg { padding: 10px; margin-top: 15px; border-radius: 4px; font-weight: bold; }
        .msg.success { background: #dcfce7; color: #15803d; }
        .msg.error { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Employee Status Dashboard</h2>
        <div id="statusMsg"></div>
        <table>
            <thead><tr><th>ID</th><th>Employee Name</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="employeeTableBody"></tbody>
        </table>
    </div>
    <script src="Employee-Status-Dashboard.js"></script>
</body>
</html>
