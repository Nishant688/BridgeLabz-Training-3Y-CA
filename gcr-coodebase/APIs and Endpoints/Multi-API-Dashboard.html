<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-API Dashboard - Promise.all</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 40px; }
        .card { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .metric-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 20px; text-align: center; }
        .metric-val { font-size: 2.2rem; font-weight: bold; color: #2563eb; margin: 8px 0; }
        .warning-box { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Enterprise Telemetry Dashboard</h2>
        <div id="warningBanner" class="warning-box" style="display: none;"></div>
        <div class="metric-grid">
            <div class="metric-box">
                <div>Total Active Users</div>
                <div id="userCount" class="metric-val">...</div>
                <small>/users endpoint</small>
            </div>
            <div class="metric-box">
                <div>Total Fulfilled Orders</div>
                <div id="orderCount" class="metric-val">...</div>
                <small>/orders endpoint</small>
            </div>
            <div class="metric-box">
                <div>Total In-Stock Products</div>
                <div id="productCount" class="metric-val">...</div>
                <small>/products endpoint</small>
            </div>
        </div>
    </div>
    <script src="Multi-API-Dashboard.js"></script>
</body>
</html>
