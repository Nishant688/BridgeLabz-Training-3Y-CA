<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form Validator</title>
    <style>
        body { font-family: sans-serif; padding: 25px; background: #f8fafc; }
        .form-card { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: red; font-size: 0.85rem; margin-top: 4px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Student Registration</h2>
        <form id="studentForm">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" placeholder="John Doe">
                <div class="error" id="nameError"></div>
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" placeholder="john@domain.com">
                <div class="error" id="emailError"></div>
            </div>
            <div class="form-group">
                <label for="phone">Phone (10 digits):</label>
                <input type="text" id="phone" placeholder="9876543210">
                <div class="error" id="phoneError"></div>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Pass@1234">
                <div class="error" id="passwordError"></div>
            </div>
            <button type="submit">Submit Registration</button>
        </form>
    </div>
    <script src="Student-Registration-Form-Validator.js"></script>
</body>
</html>
