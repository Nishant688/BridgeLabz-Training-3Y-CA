<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Object Updater</title>
</head>
<body style="font-family: sans-serif; padding: 25px;">
    <h2>Edit User Profile</h2>
    <form id="userEditForm" style="max-width: 350px;">
        <div style="margin-bottom: 10px;">
            <label>Name:</label>
            <input type="text" id="editName" value="John" style="width:100%; padding: 6px;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Email:</label>
            <input type="email" id="editEmail" value="john@mail.com" style="width:100%; padding: 6px;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Age:</label>
            <input type="number" id="editAge" value="21" style="width:100%; padding: 6px;">
        </div>
        <button type="submit" style="background: #16a34a; color: white; padding: 8px 14px; border:none; border-radius: 4px; cursor:pointer;">Update Profile</button>
    </form>
    <h3 style="margin-top: 25px;">Live User State:</h3>
    <pre id="liveUserDisplay" style="background:#f1f5f9; padding: 15px; border-radius: 6px;"></pre>
    <script src="Dynamic-Object-Updater.js"></script>
    <script>
        const display = document.getElementById('liveUserDisplay');
        display.innerText = JSON.stringify(user, null, 2);
        document.getElementById('userEditForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const n = document.getElementById('editName').value;
            const em = document.getElementById('editEmail').value;
            const a = document.getElementById('editAge').value;
            updateUser(n, em, a);
            display.innerText = JSON.stringify(user, null, 2);
        });
    </script>
</body>
</html>
