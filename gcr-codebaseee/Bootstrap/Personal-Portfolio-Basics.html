<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio - Nishant Prajapati</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Personal-Portfolio-Basics.css">
</head>
<body class="bg-light text-dark">
    <!-- Header with Name & Tagline using text-center, mt-4, mb-3, fw-bold -->
    <header class="container text-center mt-4 mb-3">
        <h1 class="display-5 fw-bold text-dark">Nishant Prajapati</h1>
        <p class="lead text-secondary mb-0">Full Stack Developer &amp; Cloud Infrastructure Specialist</p>
    </header>

    <main class="container text-center">
        <!-- Profile Image (.img-fluid, .rounded-circle) -->
        <section class="mb-4">
            <svg class="img-fluid rounded-circle shadow profile-avatar" width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0d6efd"/>
                        <stop offset="100%" stop-color="#0a58ca"/>
                    </linearGradient>
                </defs>
                <circle cx="90" cy="90" r="90" fill="url(#pGrad)"/>
                <circle cx="90" cy="70" r="34" fill="#ffffff"/>
                <path d="M35 155 C35 115, 60 110, 90 110 C120 110, 145 115, 145 155 Z" fill="#ffffff"/>
            </svg>
        </section>

        <!-- Two Buttons: Hire Me & Download CV -->
        <section class="mb-5 d-flex justify-content-center gap-3">
            <a href="#contact" class="btn btn-primary px-4 py-2 fw-semibold">Hire Me</a>
            <a href="#cv" class="btn btn-outline-secondary px-4 py-2 fw-semibold">Download CV</a>
        </section>

        <!-- Small Contact Form using .form-control inside a centered card -->
        <section class="row justify-content-center mb-5" id="contact">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Padding p-5 and background bg-white -->
                <div class="p-5 bg-white border rounded-4 shadow-sm text-start">
                    <h2 class="h4 fw-bold text-center text-dark mb-4">Send a Direct Inquiry</h2>
                    <form action="#" method="POST">
                        <div class="mb-3">
                            <label for="nameInput" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="nameInput" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label for="emailInput" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="messageInput" class="form-label fw-semibold">Message</label>
                            <textarea class="form-control" id="messageInput" rows="3" placeholder="Tell me about your project requirements..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Submit Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center py-4 text-secondary border-top mt-5 bg-white">
        <p class="mb-0">&copy; 2026 Nishant Prajapati • Personal Portfolio Showcase</p>
    </footer>

    <!-- Bootstrap 5 JS Bundle via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
